# ============================================
# romate-mcp-server 配置示例
# ============================================
# 将本地 stdio MCP 工具暴露为 HTTP/SSE 协议
# ============================================

server:
  # HTTP 服务器监听端口
  port: 3100
  # 监听地址
  host: "0.0.0.0"
  # 可选：Bearer Token 鉴权
  # auth:
  #   token: "your-secret-token"

tools:
  # ---- 示例 1: 文件系统工具 ----
  - name: "filesystem"
    description: "文件系统操作工具，可读写文件、目录"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/tmp"
    restart: true
    restartDelay: 2000

  # ---- 示例 2: GitHub 工具 ----
