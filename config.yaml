# ============================================
# romate-mcp-server 配置示例
# ============================================
# 将本地 stdio MCP 工具暴露为 HTTP/SSE 协议
# ============================================

server:
  # HTTP 服务器监听端口
  port: 3100
  # 监听地址
  host: "0.0.0.0"
  # 可选：Bearer Token 鉴权
  # auth:
  #   token: "your-secret-token"

tools:
  # ---- OpenWrt MCP 服务器 ----
  - name: "openwrt"
    description: "OpenWrt 路由器管理工具，可执行 Ubus、LuCI 等操作"
    command: "node"
    args:
      - "F:/workspace/study/ai/kaifa-openwrt/openwrt-mcp-server/dist/index.js"
    restart: true
    restartDelay: 2000
    handshakeTimeout: 30000

  # ---- Chrome DevTools MCP 服务器 ----
  - name: "chrome-devtools"
    description: "Chrome 浏览器调试工具，支持抓包、页面分析、DOM 操作等"
    command: "chrome-devtools-mcp"
    args:
      - "--autoConnect"
      - "--allow-unrestricted-paths"
    restart: true
    restartDelay: 2000
    handshakeTimeout: 30000

  - name: "acs-mcp-server"
    description: "ACS (Auto Configuration Server) MCP 服务器，用于配置和管理 OpenWrt 设备"
    command: "node"
    args:
      - "F:/workspace/study/ai/kaifa-openwrt/acs-mcp-server/dist/index.js"
    restart: true
    restartDelay: 2000
    handshakeTimeout: 30000
  # ---- OpenWrt 构建工具 ----
  - name: "openwrt-build"
    description: "OpenWrt 构建工具，可用于编译、配置 OpenWrt 固件"
    command: "node"
    args:
      - "F:/workspace/study/ai/kaifa-openwrt/work-mcp-server/dist/index.js"
    restart: true
    restartDelay: 2000
    handshakeTimeout: 30000

# ---- Windows 桌面自动化 ----
  - name: "windows-mcp"
    description: "Windows 桌面自动化工具，支持应用控制、窗口操作、UI 交互等"
    command: "F:/workspace/study/ai/kaifa-openwrt/Windows-MCP/.venv/Scripts/windows-mcp.exe"
    args:
      - "serve"
      - "--no-control"
    restart: true
    restartDelay: 2000
    handshakeTimeout: 150000
